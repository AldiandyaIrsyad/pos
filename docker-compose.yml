services:
  db:
    image: postgres:16
    container_name: pos-db
    environment:
      # (see .env.example). Only applied when the data volume is
      # first created; changing it later does not change an existing DB password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

      # migrations on first creation
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pos"]
      interval: 5s
      timeout: 5s
      retries: 60

  api:
    build: ./pos-api
    container_name: pos-api
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/pos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Open http://localhost:8000
  web:
    build: ./pos-web
    container_name: pos-web
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
