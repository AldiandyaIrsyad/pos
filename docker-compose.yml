services:
  db:
    image: postgres:16
    container_name: pos-db
    environment:
      # (see .env.example). Only applied when the data volume is
      # first created; changing it later does not change an existing DB password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

      # migrations on first creation
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pos"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
