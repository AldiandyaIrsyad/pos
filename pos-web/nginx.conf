server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/products -> http://api:8080/products (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        # Same ID in the nginx log and the pos-api log.
        proxy_set_header X-Request-ID $request_id;
    }

    # Client-side routes (/cashier, /reports) all load index.html.
    location / {
        try_files $uri /index.html;
    }
}
